name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android (plateforme 34)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build depuis le zip
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP" || { echo "Aucun .zip a la racine du repo"; exit 1; }
          unzip -q "$ZIP" -d _src
          cd "$(dirname "$(find _src -name settings.gradle | head -n 1)")"
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RecompLauncher-Android.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RecompLauncher Android
          prerelease: true
          files: RecompLauncher-Android.apk
